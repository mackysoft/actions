name: Inspect NuGet package state
description: Check whether expected NuGet packages already exist for one version.

inputs:
  version:
    description: Package version to inspect.
    required: true
  package-ids:
    description: Newline-separated package IDs.
    required: true
  source-base-url:
    description: NuGet flat container base URL.
    required: false
    default: https://api.nuget.org/v3-flatcontainer
  fail-on-partial:
    description: Whether to fail when some packages exist and others are missing.
    required: false
    default: "true"

outputs:
  all-packages-exist:
    description: true when every package exists.
    value: ${{ steps.inspect.outputs.all-packages-exist }}
  publish-required:
    description: true when packages should be published.
    value: ${{ steps.inspect.outputs.publish-required }}
  existing-package-ids:
    description: Newline-separated existing package IDs.
    value: ${{ steps.inspect.outputs.existing-package-ids }}
  missing-package-ids:
    description: Newline-separated missing package IDs.
    value: ${{ steps.inspect.outputs.missing-package-ids }}

runs:
  using: composite
  steps:
    - name: Inspect NuGet package state
      id: inspect
      shell: bash
      env:
        NUGET_FAIL_ON_PARTIAL: ${{ inputs.fail-on-partial }}
        NUGET_PACKAGE_IDS: ${{ inputs.package-ids }}
        NUGET_PACKAGE_VERSION: ${{ inputs.version }}
        NUGET_SOURCE_BASE_URL: ${{ inputs.source-base-url }}
      run: bash "${GITHUB_ACTION_PATH}/../internal/inspect-nuget-package-state.sh"

