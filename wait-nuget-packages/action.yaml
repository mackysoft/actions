name: Wait for NuGet packages
description: Wait until expected NuGet packages are available from a flat container feed.

inputs:
  version:
    description: Package version to wait for.
    required: true
  package-ids:
    description: Newline-separated package IDs.
    required: true
  attempts:
    description: Number of availability attempts.
    required: false
    default: "30"
  interval-seconds:
    description: Seconds to sleep between attempts.
    required: false
    default: "10"
  source-base-url:
    description: NuGet flat container base URL.
    required: false
    default: https://api.nuget.org/v3-flatcontainer

runs:
  using: composite
  steps:
    - name: Wait for NuGet packages
      shell: bash
      env:
        NUGET_PACKAGE_IDS: ${{ inputs.package-ids }}
        NUGET_PACKAGE_VERSION: ${{ inputs.version }}
        NUGET_SOURCE_BASE_URL: ${{ inputs.source-base-url }}
        NUGET_WAIT_ATTEMPTS: ${{ inputs.attempts }}
        NUGET_WAIT_INTERVAL_SECONDS: ${{ inputs.interval-seconds }}
      run: bash "${GITHUB_ACTION_PATH}/../internal/wait-nuget-packages.sh"

